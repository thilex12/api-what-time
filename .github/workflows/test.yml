on:
    push:
        branches:
        - main
    pull_request:
        branches:
        - main
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set up JDK 25
            uses: actions/setup-java@v3
            with:
                distribution: 'temurin'
                java-version: '25'

          - name: Test Spring Boot Application
            run: |
              ./mvnw test
          
