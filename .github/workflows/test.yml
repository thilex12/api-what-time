on:
    push:
        branches:
        - main
        - dev
    pull_request:
        branches:
        - main
        - dev
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Setup JDK 25
            uses: actions/setup-java@v4
            with:
              distribution: 'temurin'
              java-version: '25'

          - name: Cache Maven packages
            uses: actions/cache@v3
            with:
              path: ~/.m2/repository
              key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
              restore-keys: ${{ runner.os }}-maven-

          - name: Give excution permission for Maven Wrapper
            run: |
              chmod +x mvnw

          - name: Compile
            run: |
              ./mvnw compile

          - name: Test Spring Boot Application
            run: |
              ./mvnw test
          
