name: Deploy et docker

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
    deploy-docker:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout
            uses: actions/checkout@v5

          - name: Set up JDK 25
            uses: actions/setup-java@v5
            with:
              distribution: temurin
              java-version: "25"
              cache: maven

#          - name : Clean and install dependencies
#            run: mvn clean install -DskipTests=true

          - name: package the application
            run: mvn package

          - name: Extract version from pom.xml
            id: extract_version
            run: |
              VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
              echo "version=$VERSION" >> $GITHUB_OUTPUT
              echo "Version du projet: $VERSION"

          - name: Generate build timestamp
            id: timestamp
            run: echo "timestamp=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

          - name: Log in to Docker Hub
            uses: docker/login-action@v2
            with:
              username: ${{ secrets.DOCKER_HUB_USERNAME }}
              password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

          - name: Build and push Docker image
            uses: docker/build-push-action@v4
            with:
              context: .
              push: true
              tags: |
                ${{ secrets.DOCKER_HUB_USERNAME }}/what-time:latest
                ${{ secrets.DOCKER_HUB_USERNAME }}/what-time:${{ steps.extract_version.outputs.version }}
#                ${{ secrets.DOCKER_HUB_USERNAME }}/what-time:${{ steps.extract_version.outputs.version }}-${{ steps.timestamp.outputs.timestamp }}
